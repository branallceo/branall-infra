<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONTENTS | 브랜올 BRANALL</title>
<meta name="description" content="브랜올 콘텐츠 제작과 미디어믹스: AI 비주얼, SNS 카드뉴스, 바이럴 숏폼, 브랜드 필름, 촬영·편집, 전략 컨설팅, 퍼포먼스 마케팅.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--ink:#f4f4f2;--mute:#9a9aa2;--line:#26262c;--blue:#2b3cf0;--blue2:#4352ff;--card:#141418;--card2:#1c1c22}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}h1,h2,h3,h4{text-wrap:balance}p{text-wrap:pretty}
a{color:inherit;text-decoration:none}button{font-family:inherit}
.en{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:800;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;transition:.2s;border:0;cursor:pointer}
.btn.blue{background:var(--blue);color:#fff}.btn.blue:hover{background:var(--blue2)}
.btn.line{border:1px solid #ffffff55;color:#fff;background:transparent}.btn.line:hover{background:#fff;color:#000}
.btn.white{background:#fff;color:#000}.btn.white:hover{background:#e8e8ff}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 48px;background:#0b0b0d99;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #ffffff10}
.logo{font-size:26px}.logo sup{font-size:.4em;margin-left:2px}
nav.main{display:flex;gap:36px;font-size:14px;font-weight:600;letter-spacing:.05em}
nav.main a{opacity:.75;transition:.2s}nav.main a:hover{opacity:1}
.hright{display:flex;align-items:center;gap:12px}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;background:transparent;cursor:pointer;position:relative}
.burger i{position:absolute;left:13px;right:13px;height:2px;background:#fff;transition:.25s}.burger i:nth-child(1){top:17px}.burger i:nth-child(2){top:25px}
body.mopen .burger i:nth-child(1){top:21px;transform:rotate(45deg)}body.mopen .burger i:nth-child(2){top:21px;transform:rotate(-45deg)}
.mmenu{position:fixed;inset:0;z-index:45;background:#0b0b0d;padding:110px 24px 40px;display:flex;flex-direction:column;gap:6px;transform:translateY(-100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
body.mopen .mmenu{transform:none}
.mmenu a.m{font-size:34px;font-weight:800;letter-spacing:-.03em;padding:12px 0;border-bottom:1px solid var(--line)}
.mmenu .mc{margin-top:auto;display:grid;gap:10px;font-size:15px;color:#c8c8cc}
/* hero */
.hero{position:relative;height:900px;overflow:hidden}
.wall{position:absolute;inset:-12% -4%;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;transform:rotate(-6deg)}
.col{display:flex;flex-direction:column;gap:14px;animation:up 70s linear infinite}
.col:nth-child(even){animation-name:down;animation-duration:80s}
@keyframes up{to{transform:translateY(-50%)}}@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.tile{aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#1a1a1f}
.tile video,.tile img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(85% 75% at 28% 62%,#0b0b0df5 0,#0b0b0dc8 45%,#0b0b0d70 100%)}
.hcopy{position:absolute;z-index:2;left:48px;bottom:100px;max-width:920px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#c9ccff;margin-bottom:22px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 4px #ff3b3b33;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.hcopy h1{font-size:clamp(44px,6.4vw,98px);line-height:1.08;font-weight:800;letter-spacing:-.035em}
.hcopy h1 em{font-style:normal;color:var(--blue);background:#fff;display:inline-block;line-height:1;padding:0 .1em .015em;border-radius:.08em;vertical-align:baseline}
.hcopy p{margin:26px 0 34px;font-size:19px;line-height:1.6;color:#d6d6da;max-width:620px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}
.chips{position:absolute;z-index:2;right:48px;bottom:100px;display:flex;flex-direction:column;gap:10px}
.chip{background:#ffffff12;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff22;border-radius:14px;padding:14px 18px;min-width:220px}
.chip b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}.chip span{font-size:13px;color:#c8c8cc}
.scrollhint{position:absolute;z-index:2;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#ffffff88;display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollhint:after{content:"";width:1px;height:28px;background:linear-gradient(#fff8,transparent);animation:sh 1.6s infinite}
@keyframes sh{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* logos */
.logos{overflow:hidden;padding:44px 0;position:relative;margin-bottom:80px}
.logos:before,.logos:after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2}
.logos:before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}.logos:after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.ltrack{display:flex;gap:80px;width:max-content;animation:mq 40s linear infinite;align-items:center}
.ltrack img{height:30px;opacity:.7;transition:opacity .2s}.ltrack img.sq{height:46px}.ltrack img:hover{opacity:1}
.ltrack.rev{animation-direction:reverse;animation-duration:55s;margin-top:34px}
.logos:hover .ltrack{animation-play-state:paused}
/* clients grid */
.clients{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.clients>div{aspect-ratio:16/9;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .25s;position:relative}
.clients>div:hover{background:var(--card)}
.clients img{max-width:58%;max-height:34%;object-fit:contain;opacity:.62;transition:opacity .25s,transform .25s}
.clients img.sq{max-height:58%}
.clients>div:hover img{opacity:1;transform:scale(1.05)}
.clients>div span{position:absolute;left:12px;bottom:9px;font-size:11px;color:#6c6c76;opacity:0;transition:.25s}.clients>div:hover span{opacity:1}
.clients .more{grid-column:1/-1;aspect-ratio:auto;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;padding:30px 0;font-size:15px;color:#c9ccff;font-weight:700;text-align:center;line-height:1.5}
.clients .more b{display:block;font-size:30px;color:#fff;letter-spacing:-.02em}@media(max-width:900px){.clients .more{gap:8px}}
.posts.collapsed .post.extra{display:none}
.moreref{display:flex;justify-content:center;gap:10px;margin-top:44px;flex-wrap:wrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* common */
section.pad{padding:130px 48px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:48px;flex-wrap:wrap}
.sh h2,.h2{font-size:clamp(34px,4.2vw,62px);line-height:1.12;font-weight:800;letter-spacing:-.035em}
.sh h2 small,.kick{display:block;font-size:13px;letter-spacing:.16em;color:var(--mute);margin-bottom:16px;font-weight:700}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:none}
/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:start}
.about .state{font-size:clamp(28px,3.1vw,46px);line-height:1.38;font-weight:700;letter-spacing:-.03em}
.about .state b{color:#fff;background:linear-gradient(transparent 60%,#2b3cf0aa 60%);padding:0 .08em;margin:0 -.04em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.about .state span{color:#6e6e78}
.pillars{display:grid;gap:14px}
.pil{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:56px 1fr;gap:6px 18px}
.pil .no{grid-row:span 2;width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:15px}
.pil h3{font-size:21px;letter-spacing:-.02em}.pil h3 small{font-family:Archivo,sans-serif;font-size:12px;color:#c9ccff;letter-spacing:.06em;margin-left:8px;font-weight:600}
.pil p{font-size:15px;color:#bdbdc4;line-height:1.6;text-wrap:pretty}.pil h3{line-height:1.25;align-self:end}.pil p{align-self:start}
/* reference */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{background:transparent;color:var(--ink);border:1px solid #3a3a42;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.filters button:hover{border-color:#777}.filters button.on{background:#fff;color:#000;border-color:#fff}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s,border-color .25s}
.post:hover{transform:translateY(-6px);border-color:#44444c}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;padding:5px;flex:0 0 36px}
.av img{width:100%;height:100%;object-fit:contain}.av b{color:#000;font-size:13px}
.ph b{font-size:14px}.ph span{font-size:12px;color:var(--mute);display:block}
.ph .tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;color:#c9ccff;border:1px solid #2b3cf099;padding:4px 9px;border-radius:999px}
.post .img{aspect-ratio:1/1;overflow:hidden;background:#fff;display:grid;place-items:center}
.post .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.post .img.logo img{width:62%;height:auto;object-fit:contain}
.post:hover .img img{transform:scale(1.04)}
.pf{padding:16px 18px 22px}
.icons{display:flex;gap:14px;margin-bottom:12px;opacity:.9}
.icons svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.icons svg.save{margin-left:auto}
.metric{font-size:26px;font-weight:800;letter-spacing:-.02em}
.metric small{font-size:13px;color:var(--mute);font-weight:600;margin-left:6px}
.cap{margin-top:8px;font-size:14px;line-height:1.55;color:#cfcfd4}.cap b{color:#fff}
.post.hide,.posts.collapsed .post.hide{display:none}
/* channels */
.chan{display:grid;grid-template-columns:320px 1fr;gap:40px;align-items:stretch}
.tabs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:22px 4px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;display:flex;justify-content:space-between;color:#8c8c94;transition:.2s}
.tabs button:hover{color:#ddd}.tabs button.on{color:#fff}.tabs button.on:after{content:"●";color:var(--blue)}
.panel{display:grid;grid-template-columns:300px 1fr;gap:36px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;min-height:0}
.panel .media{aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;align-self:start}
.panel .media video,.panel .media img{width:100%;height:100%;object-fit:cover;display:block}
.panel .media.wide{aspect-ratio:auto;background:none}.panel .media.wide img{height:auto;border-radius:16px}
.panel h3{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:8px 0 18px}
.panel .k{font-size:13px;letter-spacing:.12em;color:#c9ccff;font-weight:700}
.panel p{font-size:17px;line-height:1.7;color:#d0d0d6}
.panel ul{list-style:none;margin:26px 0 30px;display:grid;gap:10px}
.panel li{padding:14px 16px;background:var(--card2);border-radius:12px;font-size:15px}
.panel li b{color:#fff;margin-right:10px}
/* reels */
.strip{display:flex;gap:14px;overflow-x:auto;padding:0 48px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 220px;scroll-snap-align:start;position:relative;cursor:pointer}
.strip .tile:after{content:"";position:absolute;left:12px;bottom:12px;width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;opacity:.85}
.snav{display:flex;gap:8px}.snav button{width:48px;height:48px;border-radius:50%;border:1px solid #3a3a42;background:transparent;color:#fff;font-size:18px;cursor:pointer}.snav button:hover{background:#fff;color:#000}
/* process */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;min-height:250px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pr .n{font-size:64px;line-height:1;color:#3a3a46}
.pr h4{font-size:22px;margin:auto 0 10px;letter-spacing:-.02em}
.pr p{font-size:15px;color:#b4b4bc;line-height:1.6}
.pr:hover{border-color:var(--blue)}.pr:hover .n{color:var(--blue)}
/* insight */
.ins{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.ins a{border-top:2px solid #fff;padding-top:18px;display:block;transition:.2s}
.ins a:hover h4{color:#c9ccff}
.ins span{font-size:12px;color:#c9ccff;font-weight:700;letter-spacing:.1em}
.ins h4{font-size:19px;line-height:1.45;margin-top:10px;font-weight:700;transition:.2s}
.ins i{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:14px}
/* contact */
.cta{position:relative;overflow:hidden;background:var(--blue);padding:120px 48px}
.cta .in{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start;max-width:1344px;margin:0 auto}
#formslot{min-height:770px}
@media(max-width:900px){#formslot{min-height:980px}}
.cta h2{font-size:clamp(46px,6vw,96px);line-height:1.02;font-weight:800;letter-spacing:-.04em}
.cta .lead{font-size:19px;margin:26px 0 40px;opacity:.92;line-height:1.6}
.contacts{display:grid;gap:12px;font-size:16px}
.contacts a{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ffffff40}
.contacts a b{font-size:12px;letter-spacing:.14em;opacity:.75}
form{background:#fff;color:#111;border-radius:24px;padding:34px;display:grid;gap:16px}
form h3{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form label{font-size:13px;font-weight:700;color:#44444b;display:grid;gap:8px}
form input,form textarea{border:1px solid #dcdce4;border-radius:12px;padding:14px;font:15px Pretendard,sans-serif;background:#fafafc;width:100%}
form textarea{min-height:96px;resize:vertical}
form input:focus,form textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick span{border:1px solid #dcdce4;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.15s}
.pick span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.agree{font-size:13px;color:#44444b;display:flex;gap:8px;align-items:center;justify-content:flex-start}.agree input{width:18px;height:18px;flex:0 0 18px;padding:0;accent-color:var(--blue)}.agree label{display:inline!important}.agree a{text-decoration:underline}
form .btn{width:100%;padding:17px;font-size:16px}
footer{padding:44px 48px;font-size:13px;color:#8a8a92;line-height:1.9;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer .flogo{font-size:22px;color:#fff;margin-bottom:12px}
footer a{text-decoration:underline;text-underline-offset:3px}
.kakao{position:fixed;right:22px;bottom:22px;z-index:40;background:#fee500;color:#191919;font-weight:800;font-size:14px;padding:14px 18px;border-radius:999px;box-shadow:0 10px 30px #0006;display:flex;align-items:center;gap:8px}
.kakao svg{width:20px;height:20px}
.note{position:fixed;left:16px;bottom:16px;z-index:99;background:#fff;color:#000;font-size:12px;font-weight:700;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px #0006}
.lb{position:fixed;inset:0;z-index:100;background:#000e;display:none;place-items:center}
.lb.on{display:grid}.lb video{height:86vh;max-width:92vw;border-radius:14px;background:#000}
.lb .x{position:absolute;top:20px;right:24px;font-weight:700;cursor:pointer;font-size:14px;letter-spacing:.1em}
.lb .lr{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid #fff5;background:#0008;color:#fff;font-size:20px;cursor:pointer}
.lb .l{left:24px}.lb .r{right:24px}
.lb .c{position:absolute;bottom:22px;font-size:13px;color:#aaa}
@media(max-width:1100px){.proc{grid-template-columns:1fr 1fr}.about{grid-template-columns:1fr;gap:50px}.chan{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;border:0;gap:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:1px solid #3a3a42;border-radius:999px;padding:10px 16px;font-size:15px;white-space:nowrap}.tabs button.on{background:#fff;color:#000}.tabs button.on:after{content:""}}
@media(max-width:900px){
 header{padding:14px 20px}nav.main{display:none}.logo{font-size:21px}.burger{display:block}.hright .btn{display:none}
 .hero{height:820px}.wall{grid-template-columns:repeat(3,1fr);inset:-10% -20%}
 .hcopy{left:20px;right:20px;bottom:170px}.hcopy p{font-size:16px}
 .chips{left:20px;right:20px;bottom:40px;flex-direction:row;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
 .chip{min-width:150px;padding:10px 14px}.chip b{font-size:20px}.scrollhint{display:none}
 section.pad{padding:84px 20px}.sh{margin-bottom:32px}
 .posts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}.posts::-webkit-scrollbar{display:none}
 .post{flex:0 0 84%;scroll-snap-align:center}.post:hover{transform:none}
 .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}.filters button{white-space:nowrap}
 .panel{grid-template-columns:1fr;padding:18px;min-height:0}.panel .media{max-height:460px;aspect-ratio:auto}.panel .media video{max-height:460px}.panel h3{font-size:28px}
 .strip{padding:0 20px}.strip .tile{flex-basis:160px}.snav{display:none}
 .proc{grid-template-columns:1fr}.pr{min-height:0}.pr h4{margin-top:24px}
 .ins{grid-template-columns:1fr}
 .cta{padding:84px 20px}.cta .in{grid-template-columns:1fr;gap:40px}form{padding:22px}.fr{grid-template-columns:1fr}
 footer{padding:32px 20px 100px}
 .ltrack img{height:22px}.ltrack img.sq{height:34px}.ltrack{gap:44px}.ltrack.rev{margin-top:18px}.logos:before,.logos:after{width:40px}
 .clients{grid-template-columns:repeat(4,minmax(0,1fr))}.clients>div{min-width:0;overflow:hidden}.clients img{max-width:74%;max-height:44%}.clients .more{font-size:11px;gap:8px;padding:20px 0}.clients .more b{font-size:22px}
 .posts.collapsed .post.extra{display:block}.posts.collapsed .post.extra.hide{display:none}#moreBtn{display:none}
 .kakao{right:16px;bottom:16px;padding:12px 16px}.note{bottom:auto;top:76px;left:auto;right:12px}
}
.chnote2{font-size:13px;color:#9a9aa2;border-left:3px solid var(--blue);padding:8px 12px;background:#17171b;border-radius:0 8px 8px 0;margin-bottom:18px}
.panel ul li{align-items:start}
.ins a{border-top:0;padding-top:0}.ins .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid var(--line);display:block}
.tabs .tgrp{font-family:Archivo,sans-serif;font-size:11px;letter-spacing:.14em;color:#c9ccff;font-weight:700;margin:22px 0 4px;padding-bottom:8px}
.tabs .tgrp:first-child{margin-top:0}
.panel .media{aspect-ratio:4/5;overflow:hidden;border-radius:16px}
